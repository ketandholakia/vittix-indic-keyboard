<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vittix Tray and Editor Redesign</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #101114;
    --bg-subtle: #17191d;
    --surface: #1c1e23;
    --surface-raised: #24272e;
    --border: rgba(255,255,255,0.07);
    --border-hover: rgba(255,255,255,0.14);
    --accent: #7CB0FF;
    --accent-dim: rgba(124,176,255,0.15);
    --text: #E6E8EC;
    --text-secondary: rgba(230,232,236,0.62);
    --text-tertiary: rgba(230,232,236,0.34);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.25);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.3);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.35);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    /* font-stack: Segoe UI / system-ui, per the selected design system's DESIGN.md typography rules */
    --font-sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
    --note-bg: #1b2029;
    --note-border: rgba(124,176,255,0.22);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  .canvas-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    --grid-color: rgba(255,255,255,0.045);
    background-image:
      radial-gradient(900px 620px at 12% -6%, rgba(124,176,255,0.10), transparent 62%),
      radial-gradient(760px 520px at 88% 8%, rgba(124,176,255,0.055), transparent 60%);
  }
  .canvas-viewport.panning { cursor: grabbing; }

  .canvas-world {
    position: absolute;
    left: 0; top: 0;
    width: 20000px; height: 20000px;
    transform-origin: 0 0;
    will-change: transform;
  }

  .canvas-el {
    position: absolute;
    cursor: grab;
    transition: box-shadow var(--transition-normal), transform var(--transition-fast);
  }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging {
    cursor: grabbing;
    z-index: 999;
    box-shadow: var(--shadow-drag) !important;
    transform: scale(1.01);
    transition: none;
  }

  .section-header {
    position: absolute;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 16px;
    white-space: nowrap;
  }
  .section-header .section-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0.85;
  }
  .section-header .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .section-header .section-line {
    flex: none;
    width: 48px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, transparent 100%);
    opacity: 0.35;
  }

  .canvas-title {
    position: absolute;
    pointer-events: none;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.025em;
    color: var(--text);
  }

  .canvas-text {
    position: absolute;
    line-height: 1.7;
    letter-spacing: 0.004em;
    color: var(--text-secondary);
    min-width: 200px;
    max-width: 560px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .canvas-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .canvas-tag .tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .context-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-width: 220px;
  }
  .context-card .card-head {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .context-card .card-head .head-indicator {
    width: 3px;
    height: 16px;
    border-radius: 2px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .context-card .card-head h3 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .context-card .card-content {
    padding: 0 20px 20px;
    font-size: 13px;
    line-height: 1.68;
    color: var(--text-secondary);
  }
  .context-card .card-content ul { list-style: none; padding: 0; }
  .context-card .card-content li {
    padding: 4px 0 4px 12px;
    position: relative;
  }
  .context-card .card-content li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 11px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-tertiary);
  }

  .ds-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .ds-card .ds-head {
    padding: 16px 20px 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .ds-card .ds-body { padding: 0 20px 22px; }

  .ds-card .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
    gap: 10px;
  }
  .ds-card .color-chip {
    height: 46px;
    border-radius: var(--radius-sm);
    position: relative;
    border: 1px solid rgba(255,255,255,0.09);
  }
  .ds-card .color-chip .chip-label {
    position: absolute;
    bottom: -17px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    white-space: nowrap;
  }

  .ds-card .type-stack { display: flex; flex-direction: column; gap: 13px; }
  .ds-card .type-row { display: flex; align-items: baseline; gap: 16px; }
  .ds-card .type-label {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 76px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .ds-card .type-sample {
    color: var(--text);
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .color-swatch-group { display: flex; flex-wrap: wrap; gap: 18px; }
  .swatch-item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .swatch-circle {
    width: 52px; height: 52px;
    border-radius: 50%;
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .swatch-name { font-size: 10px; font-weight: 500; color: var(--text-secondary); text-align: center; }
  .swatch-hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); text-align: center; }

  .type-sample-group { display: flex; flex-direction: column; gap: 18px; min-width: 400px; }
  .type-sample-row { display: flex; align-items: baseline; gap: 20px; }
  .type-sample-meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-tertiary);
    min-width: 66px;
    flex-shrink: 0;
    letter-spacing: 0.04em;
  }
  .type-sample-text { color: var(--text); line-height: 1.25; }

  .canvas-note {
    background: var(--note-bg);
    border: 1px solid var(--note-border);
    border-radius: var(--radius-md);
    padding: 16px 18px;
    min-width: 200px;
    max-width: 300px;
    box-shadow: var(--shadow-sm);
  }
  .canvas-note .note-tag {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.8;
    margin-bottom: 8px;
  }
  .canvas-note .note-body { font-size: 13px; line-height: 1.65; color: var(--text-secondary); }

  .design-page {
    background: #fff;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }
  .design-page .page-content { width: 100%; height: 100%; overflow: hidden; }
  .page-label {
    position: absolute;
    bottom: -32px;
    left: 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-tertiary);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .page-label .label-num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); opacity: 0.7; }

  .canvas-diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .canvas-diagram .diagram-content { width: 100%; height: 100%; padding: 20px; }

  .zoom-controls {
    position: fixed;
    bottom: 24px; right: 24px;
    display: flex;
    align-items: center;
    gap: 1px;
    z-index: 100;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .zoom-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }
  .zoom-label {
    min-width: 50px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .coord-indicator {
    position: fixed;
    bottom: 28px; left: 24px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--text-tertiary);
    z-index: 100;
    padding: 4px 10px;
    background: rgba(16,17,20,0.85);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .kbd-hint {
    position: fixed;
    top: 20px; right: 24px;
    z-index: 100;
    font-size: 10px;
    color: var(--text-tertiary);
    display: flex;
    gap: 12px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd {
    font-family: var(--font-mono);
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px;
  }
</style>
</head>
<body>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="Zoom out">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="Zoom in">+</button>
  <button class="zoom-btn" id="zoomReset" aria-label="Reset view">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>
<div class="kbd-hint" id="kbdHint"></div>

<script>
(() => {
  const UI_STRINGS = {
    docTitle: 'Vittix Tray and Editor Redesign',
    projectDescription:
      'A Windows tray utility for Devanagari and Gujarati typing, plus the Layout Editor that authors its JSON mapping files.\n' +
      'This canvas reviews both surfaces and specifies the target design: what to preserve, what to restructure, and why.',
    tags: [
      'Windows tray utility',
      'Delphi VCL',
      'Devanagari + Gujarati',
      'Layout Restructure',
      '2 surfaces, 26 findings',
    ],
    contextCards: {
      preserved: {
        title: 'Preserved',
        items: [
          'Product identity and all shipped features',
          'Layout JSON schema and validator contract',
          'settings.ini keys, hotkeys, whitelist semantics',
          'Fail-open injection behaviour',
          'Primary flows: toggle, switch layout, open editor',
        ],
      },
      restructured: {
        title: 'Restructured',
        items: [
          'Tray menu information architecture',
          'Tray icon states and resolution',
          'Editor window into rail + surface + inspector',
          'Editor selection and editing model',
          'One design token set across both surfaces',
        ],
      },
      problem: {
        title: 'Biggest source of mediocrity',
        items: [
          'No single source of truth for state or selection.',
          'The tray renders state as prose rows; the editor offers three surfaces that edit the same mapping.',
          'Everything else in this review follows from that one gap.',
        ],
      },
    },
    notes: {
      mode: { tag: 'Transformation mode', body: 'Layout Restructure. Structure and hierarchy are the problem, not surface polish. The product identity, data contracts and flows stay intact.' },
      p0: { tag: 'P0 before release', body: '7 blocking defects: a save path that deletes filtered mappings, a Settings dialog 147px taller than its window, New and Import dropping unsaved work, High Contrast rendering white on white.' },
      scale: { tag: 'Scale target', body: 'KrutiDev-sized layouts: 400 to 800 mappings. Every performance rule here assumes that range.' },
      unsourced: { tag: 'Verification note', body: 'Findings come from source analysis only. No Delphi toolchain was available, so latency claims need a stopwatch before they are treated as measured.' },
    },
    sections: {
      context: '01 PROJECT CONTEXT',
      designSystem: '02 DESIGN SYSTEM',
      deliverables: '03 DESIGN DELIVERABLES',
    },
    designSystemCards: {
      colorTitle: 'Color',
      typographyTitle: 'Typography',
      componentsTitle: 'Components',
      spacingTitle: 'Spacing and radii',
      statesTitle: 'Interaction states',
      swatchNames: ['Canvas', 'Surface', 'Inset', 'Border', 'Text', 'Muted', 'Accent', 'Accent soft', 'Success', 'Warning', 'Danger'],
    },
    zoom: { zoomIn: 'Zoom in', zoomOut: 'Zoom out', reset: 'Reset view' },
    kbdHints: [['Scroll', 'pan'], ['Ctrl+Scroll', 'zoom'], ['Ctrl+Z', 'undo']],
    demoTitle: 'Vittix Indic Keyboard',
  };

  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('zoomReset').title = UI_STRINGS.zoom.reset;
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(([keys, action]) => `<span><kbd>${keys}</kbd> ${action}</span>`)
    .join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }

  function updateGrid() {
    const g = 40 * zoom;
    viewport.style.backgroundSize = `auto, auto, ${g}px ${g}px`;
    viewport.style.backgroundPosition = `0 0, 0 0, ${panX % g}px ${panY % g}px`;
    viewport.style.backgroundImage =
      `radial-gradient(900px 620px at 12% -6%, rgba(124,176,255,0.10), transparent 62%),` +
      `radial-gradient(760px 520px at 88% 8%, rgba(124,176,255,0.055), transparent 60%),` +
      `radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)`;
  }

  let isPanning = false, panSX, panSY;
  viewport.addEventListener('pointerdown', (e) => {
    if (e.target === viewport || e.target === world) {
      isPanning = true;
      panSX = e.clientX - panX;
      panSY = e.clientY - panY;
      viewport.classList.add('panning');
      viewport.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!isPanning) return;
    panX = e.clientX - panSX;
    panY = e.clientY - panSY;
    updateTransform();
  });
  viewport.addEventListener('pointerup', () => {
    isPanning = false;
    viewport.classList.remove('panning');
  });

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
    if (e.ctrlKey || e.metaKey || !(Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3)) {
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    } else {
      panX -= e.deltaX;
      panY -= e.deltaY;
    }
    updateTransform();
  }, { passive: false });

  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom;
    panY = cy - wy * zoom;
    updateTransform();
  }
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25);
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8);
  document.getElementById('zoomReset').onclick = () => { zoom = 1; panX = 0; panY = 0; updateTransform(); };

  viewport.addEventListener('pointermove', (e) => {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = `${Math.round((e.clientX - r.left - panX) / zoom)}, ${Math.round((e.clientY - r.top - panY) / zoom)}`;
  });

  let lastPinchDist = null, lastPinchCenter = null;
  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });
  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom;
      panY = my - wy * zoom;
    }
    if (lastPinchCenter) {
      panX += center.x - lastPinchCenter.x;
      panY += center.y - lastPinchCenter.y;
    }
    lastPinchDist = dist;
    lastPinchCenter = center;
    updateTransform();
  }, { passive: false });
  viewport.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; }
  });

  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(el => s.push({ id: el.id, left: el.style.left, top: el.style.top }));
    undoStack.push({ panX, panY, zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(a => {
      const el = document.getElementById(a.id);
      if (el) { el.style.left = a.left; el.style.top = a.top; }
    });
    updateTransform();
  }
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });

  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      dragging = true;
      el.classList.add('dragging');
      saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId);
      e.stopPropagation();
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
    });
    el.addEventListener('pointerup', () => {
      if (dragging) { dragging = false; el.classList.remove('dragging'); }
    });

  function addSection(rowY, label) {
    const parts = label.split(' ');
    const num = parts[0] || '';

    el.className = 'section-header';
    el.style.left = '60px';

  }

    el.style.top = y + 'px';

    if (options.fontWeight) el.style.fontWeight = options.fontWeight;
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    return el;

  function addDesignSystemCard(x, y, w, h, type, data) {

  /* Open on Row 1 in full: derive the zoom from the rendered extent of the
     context row rather than guessing, and fit both axes. */
  const r = viewport.getBoundingClientRect();
  const headers = world.querySelectorAll('.section-header');
  const row2Top = headers.length > 1 ? parseFloat(headers[1].style.top) : 1200;
  let row1Bottom = 0, row1Right = 0;
  world.querySelectorAll('.canvas-el').forEach((e) => {
    const top = parseFloat(e.style.top), left = parseFloat(e.style.left);
    if (top < row2Top - 20) {
      row1Bottom = Math.max(row1Bottom, top + e.offsetHeight);
      row1Right = Math.max(row1Right, left + e.offsetWidth);
    }
  });
  const fitY = (r.height - 76) / Math.max(400, row1Bottom);
  const fitX = (r.width - 56) / Math.max(600, row1Right + 30);
  zoom = Math.min(1, Math.max(0.3, Math.min(fitY, fitX)));
  panX = 26;
  panY = 14;
